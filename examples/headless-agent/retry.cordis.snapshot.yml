# Keyless provider-retry composition for the headless stream-json snapshot.
- id: base
  name: '@buckeyestudio/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@buckeyestudio/toh-llm-deepseek'
        disabled: true
      - insert:
          - id: retry-snapshot-backend
            name: './tests/fixtures/retry-snapshot-backend.mjs'
