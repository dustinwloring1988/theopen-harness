# One-shot coding agent with format-pure stdout. The app bin loads the
# gitignored root `.env` into the process environment; entry configs here are
# the composition base, while user-plane values resolve per request through
# the two providers below.

# User-settings document (`$TOH_HOME/settings.yaml`, hot-reloaded): a
# `llm-deepseek:` section there overrides the adapter entry below without a
# restart.
- id: settings
  name: '@buckeyestudio/toh-settings-file'

# Credential store: the live process environment over `$TOH_HOME/.credentials.yaml`
# (owner-only file, hot-reloaded). The adapter resolves `DEEPSEEK_API_KEY`
# through it at each request, so no key is inlined in this file.
- id: credentials
  name: '@buckeyestudio/toh-credentials-local'

# The DeepSeek adapter. Swap to '@buckeyestudio/toh-llm-pi-ai' for the pi-ai-backed
# twin (a `providers` dict keyed by route; `reasoning: high` replaces
# thinking/reasoningEffort). Shipped default: full thinking at max effort on
# every request. Exact-model resolution materializes request defaults before
# the request header is logged. Model ids resolve from the e2e slot variables
# when set, so a completions gateway (DEEPSEEK_BASE_URL) serves the same
# composition unchanged; slots that collapse onto one gateway id emit one
# catalog row instead of failing the adapter's duplicate-id check.
- id: llm-deepseek
  name: '@buckeyestudio/toh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max
    models: !!js |
      (() => {
        const ids = [
          process.env.DEEPSEEK_E2E_MODEL_PRO ?? 'deepseek-v4-pro',
          process.env.DEEPSEEK_E2E_MODEL_FLASH ?? 'deepseek-v4-flash',
        ]
        return [...new Set(ids)].map(id => ({ id, contextWindow: 128000 }))
      })()

# Managed child-process groups for the bash executor (spawn/kill/output plumbing).
- id: subprocess
  name: '@buckeyestudio/toh-subprocess-local'

- id: bash
  name: '@buckeyestudio/toh-bash-local'
  config:
    timeoutMs: 60000

# The example composition pre-creates one fresh `main` agent for its test driver.
- id: agent-spine
  name: '@buckeyestudio/toh-agent-spine-demo'
  config:
    agents:
      - id: main
        provider: deepseek-official
        # Stays on the flash slot: the goal/ralph replay corpora were recorded
        # on the flash id, and their nested-include overlays cannot re-pin the
        # app config (a config patch cannot target an entry behind a nested
        # include).
        model: !!js process.env.DEEPSEEK_E2E_MODEL_FLASH ?? 'deepseek-v4-flash'
        cwd: !!js process.cwd()
    workspaceContext:
      maxBytes: 65536
    persona: |
      You are headless-agent, a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and
      factual.

- id: persistence
  name: '@buckeyestudio/toh-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: !!js "process.env.TOH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: checkpoint-policy
  name: '@buckeyestudio/toh-session-checkpoint-policy'

# Summarize an older range when derived history approaches the context window.
- id: token-meter
  name: '@buckeyestudio/toh-token-meter'

- id: compaction-basic
  name: '@buckeyestudio/toh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1

# Projection registry: durable subagent identity (mode/label) folds through
# its registered units; subagent catalog reads fail loud without the capability.
- id: session-projection
  name: '@buckeyestudio/toh-session-projection'

# Expose fresh-child `spawn` and completed-prefix `fork` through independent
# in-process backends.
- id: subagent
  name: '@buckeyestudio/toh-subagent'

- id: subagent-spawn-in-process
  name: '@buckeyestudio/toh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: subagent-fork-in-process
  name: '@buckeyestudio/toh-subagent-fork-in-process'
  config:
    providerName: fork

# Continuable background children are selected per delegation tool. The
# separately loaded control registers global `send_message`; `report` is
# installed only in continuable child scopes.
- id: tool-subagent-control
  name: '@buckeyestudio/toh-tool-subagent-control'

- id: tool-subagent-report
  name: '@buckeyestudio/toh-tool-subagent-report'

- id: tool-subagent
  name: '@buckeyestudio/toh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
    maxDepth: 1

# Fork stays one-shot because a continuable child's `report` tool and prompt
# section precede the inherited history a fork reuses; `run_in_background` is off
# as an explicit foreground-only choice even though agent-spine-demo mounts the
# generic Job runtime. See .agents/notes/implemented/architecture/2026-08-10-fork-children-stay-one-shot.md.
- id: tool-subagent-fork
  name: '@buckeyestudio/toh-tool-subagent'
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1

# The worker-thread workflow engine fans a model-written JavaScript script's
# `agent()` calls out through the spawn backend.
- id: workflow-worker-thread
  name: '@buckeyestudio/toh-workflow-worker-thread'
  config:
    provider: spawn

- id: tool-workflow
  name: '@buckeyestudio/toh-tool-workflow'

# A separate fixed consumer demonstrates fresh-agent Ralph iteration without
# changing the workflow tool or same-session goal behavior.
- id: tool-ralph
  name: '@buckeyestudio/toh-tool-ralph'

# `todo_write` replaces the logged whole list.
- id: tool-todo
  name: '@buckeyestudio/toh-tool-todo'
  config:
    allowParallelInProgress: true

# Policy loads before the model-facing filesystem tools so writes and edits
# require an observed file. Relative paths resolve from the process cwd.
- id: fs-local
  name: '@buckeyestudio/toh-fs-local'
  config:
    cwd: !!js process.cwd()

- id: fs-observation-policy
  name: '@buckeyestudio/toh-fs-observation-policy'

- id: tool-fs
  name: '@buckeyestudio/toh-tool-fs'
