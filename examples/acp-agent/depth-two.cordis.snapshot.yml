# Keyless counterpart to depth-two.cordis.yml: apply the depth patch and replace
# the live adapter with per-session replay.
- id: base
  name: '@buckeyestudio/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@buckeyestudio/toh-llm-deepseek'
        disabled: true
      - id: sandbox
        name: '@buckeyestudio/toh-sandbox-local'
        config:
          runnerCommand:
            - bash
            - -c
            - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
            - passthrough-runner
          runnerFailureSignatures:
            - 'passthrough-runner: profile rejected'
      - id: tool-subagent
        name: '@buckeyestudio/toh-tool-subagent'
        config:
          provider: spawn
          toolName: subagent
          backgroundMode: continuable
          maxDepth: 2
      # Re-pin the recorded model: cordis.yml ships deepseek-v4-pro, but this
      # scenario's corpus was captured on flash. A config patch replaces the
      # whole app config, so the base fields are restated verbatim.
      - id: acp-agent
        name: '@buckeyestudio/toh-acp-demo'
        config:
          provider: deepseek-official
          model: deepseek-v4-flash
          persistenceRoot: !!js process.env.TOH_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: none
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: llm-replay
            name: '@buckeyestudio/toh-llm-replay'
            config:
              providers:
                - id: deepseek-official
                  name: DeepSeek
                  models:
                    - id: deepseek-v4-flash
                    - id: deepseek-v4-pro
