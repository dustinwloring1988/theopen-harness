# Keyless replay keeps the LSP composition intact and replaces only the model adapter.
- id: base
  name: '@buckeyestudio/cordis-plugin-include'
  config:
    path: ../cordis.yml
    patches:
      - id: llm-deepseek
        name: '@buckeyestudio/toh-llm-deepseek'
        disabled: true
      - insert:
          - id: lsp
            name: '@buckeyestudio/toh-lsp'
          - id: lsp-stdio
            name: '@buckeyestudio/toh-lsp-stdio'
            config:
              servers:
                fixture:
                  command: !!js process.execPath
                  args: ['./lsp-server.mjs']
                  extensionToLanguage:
                    '.ts': typescript
          - id: timeout-policy
            name: '@buckeyestudio/toh-tool-call-timeout-policy'
          - id: tool-lsp
            name: '@buckeyestudio/toh-tool-lsp'
            config:
              maxLocations: 1
          - id: llm-replay
            name: '@buckeyestudio/toh-llm-replay'
