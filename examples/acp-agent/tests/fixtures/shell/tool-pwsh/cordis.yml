# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@buckeyestudio/toh-system-prompt'

- id: tools
  name: '@buckeyestudio/toh-tools'

- id: subprocess
  name: '@buckeyestudio/toh-subprocess-local'

- id: bash
  name: '@buckeyestudio/toh-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@buckeyestudio/toh-shell-env'

- id: tasks
  name: '@buckeyestudio/toh-jobs-local'

- id: tool-jobs
  name: '@buckeyestudio/toh-tool-jobs'

- id: tool-pwsh
  name: '@buckeyestudio/toh-tool-pwsh'
