name: E2E (real LLM API)

# Real-API end-to-end suite (`pnpm run test:e2e`). Unlike ci.yml this job
# consumes a provider secret and hits the external API it names; the tests read
# DEEPSEEK_API_KEY and route through @buckeyestudio/toh-llm-deepseek, whose
# baseURL and model ids the suite overrides from environment variables. Two
# provider modes exist:
#
# - deepseek (default): secret DEEPSEEK_API_KEY_EXTERNAL, base URL pinned to
#   https://api.deepseek.com.
# - openrouter: secret OPENROUTER_API_KEY_EXTERNAL takes precedence, the base
#   URL becomes https://openrouter.ai/api/v1, and every model slot runs
#   stealth/ox-alpha (override per slot with DEEPSEEK_E2E_MODEL_* secrets).
#   The Files-API image round-trip stays off: POST /files is DeepSeek-only.
#
# pull_request IS a trigger, but GitHub withholds repo secrets from BOTH forked
# PRs and Dependabot PRs (the latter are same-repo, fork==false, but still
# keyless). The job-level `if:` below skips the whole job for those untrusted
# PRs. The Dependabot test keys on the PR AUTHOR (pull_request.user.login), not
# github.actor (the run trigger) — a maintainer reopening a Dependabot PR would
# make github.actor human while the PR is still keyless. When the job runs, the
# secret is expected, so the preflight hard-fails if it's missing (a missing
# secret would otherwise make the self-skipping suite report a false green). A
# job skipped by a job-level `if:` reports as a SUCCESSFUL check, so this
# workflow is safe to use as a required status check if desired.
#
# SECURITY — NEVER change this trigger to `pull_request_target`. `pull_request`
# checks out and runs the PR's HEAD code WITHOUT secrets for forks, which is what
# keeps an untrusted fork from exfiltrating the key. `pull_request_target` runs
# in the BASE repo's context WITH secrets while still able to check out untrusted
# fork code — a textbook key-leak vector, especially once this repo is public.
# The fork/secret model and its public-repo implications are recorded in
# .agents/notes/implemented/testing/2026-06-19-real-api-e2e-ci.md.
#
# Note: scheduled triggers are auto-disabled after 60 days of repo inactivity;
# push/pull_request/workflow_dispatch act as backstops.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # 00:17 UTC nightly = 08:17 Asia/Shanghai — off the top-of-hour cron stampede.
    - cron: '17 0 * * *'

# Cancel a superseded PR run (it is on a stale commit); never cancel a
# push/schedule run — it is already producing the post-merge/nightly signal.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: this job only reads the repo to run tests.
permissions:
  contents: read

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  TOH_TELEMETRY_DISABLED: '1'

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: e2e
    # Run on every trusted event. Skip untrusted PRs (forks + Dependabot) where
    # the secret is withheld — they would otherwise hard-fail the preflight.
    if: >-
      github.event_name != 'pull_request'
      || !(github.event.pull_request.head.repo.fork || github.event.pull_request.user.login == 'dependabot[bot]')
    # Bounded file parallelism (TOH_E2E_MAX_WORKERS), 120s/test, retry 2. 45m
    # still bounds retry storms against a slow API while the happy path fans out.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # The with-key escalation e2e self-skips without a usable runner. Prepare
      # bwrap so trusted CI exercises it; the functional probe remains the
      # authority on whether the runner can use the sandbox.
      - name: Prepare bubblewrap (unrestrict userns)
        run: bash scripts/prepare-ci-bubblewrap.sh

      # Guard against a false green: the e2e suites self-skip when the key is
      # absent, so a missing/misconfigured secret would otherwise pass as
      # "all skipped". This job only runs on trusted events (the `if:` above
      # excludes keyless PRs), so a secret MUST be present — fail loudly if not.
      # Provider resolution: OPENROUTER_API_KEY_EXTERNAL wins when set; the
      # chosen key is re-exported as DEEPSEEK_API_KEY (the name every suite
      # reads) together with its base URL and model slots via GITHUB_ENV.
      - name: Resolve provider and require its secret
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_EXTERNAL }}
        run: |
          set -euo pipefail
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            echo "E2E provider: openrouter (stealth/ox-alpha)"
            {
              echo "DEEPSEEK_API_KEY=${OPENROUTER_API_KEY}"
              echo "DEEPSEEK_BASE_URL=https://openrouter.ai/api/v1"
              echo "DEEPSEEK_E2E_MODEL_FLASH=${{ vars.DEEPSEEK_E2E_MODEL_OPENROUTER || 'stealth/ox-alpha' }}"
              echo "DEEPSEEK_E2E_MODEL_PRO=${{ vars.DEEPSEEK_E2E_MODEL_OPENROUTER || 'stealth/ox-alpha' }}"
              echo "DEEPSEEK_E2E_MODEL_VISION=stealth/ox-alpha"
            } >> "$GITHUB_ENV"
          elif [ -n "${DEEPSEEK_API_KEY:-}" ]; then
            echo "E2E provider: deepseek"
            {
              echo "DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}"
              echo "DEEPSEEK_BASE_URL=https://api.deepseek.com"
            } >> "$GITHUB_ENV"
          else
            echo "::error::No provider secret. The e2e suite would self-skip and report a false green."
            echo "::error::Configure OPENROUTER_API_KEY_EXTERNAL or DEEPSEEK_API_KEY_EXTERNAL."
            exit 1
          fi

      # The e2e suites boot the example bins in `lib` mode (TOH_EXAMPLE_MODE=lib):
      # the built artifact under plain Node, resolving plugins through real package
      # exports — the shape a real consumer runs. That requires a prior build.
      - name: Build (lib for the e2e example bins)
        run: pnpm run build:official

      # Real-API end-to-end tests only. The keyless gates (lint/typecheck/
      # coverage/snapshot/etc.) already run in ci.yml (pull requests) and
      # ci-master.yml (master push standby).
      # The resolve step pinned DEEPSEEK_BASE_URL to the selected external API;
      # the key travels through GITHUB_ENV, so it never appears in this file.
      - name: E2E tests (real LLM API)
        env:
          TOH_E2E_MAX_WORKERS: 14
          TOH_EXAMPLE_MODE: lib
        run: pnpm run test:e2e
